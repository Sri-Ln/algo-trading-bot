name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -m "not network"

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm ci
      - name: API types match the FastAPI schema
        run: |
          uv run algo-trading openapi openapi.json
          npm run api-types
          git diff --exit-code -- openapi.json src/api/schema.ts
      - name: Export the API with current prices
        working-directory: .
        run: uv run algo-trading export --out web/public
      - name: Type check
        run: npm run typecheck
      - name: Unit and render tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: web/e2e/screenshots
